[alembic]
script_location = migrations
# Optional extra migration folder for extensions, beside the repo. A missing folder is ignored.
version_locations = migrations/versions ../../portfolio/migrations
version_path_separator = space
prepend_sys_path = .

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
