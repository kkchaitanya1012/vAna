# Provider catalog. Read by the API (GET /providers, cost estimates) and the voice server (building services).
# Prices are ESTIMATES in USD. Check each vendor's pricing page and edit here. `null` means unknown: the
# cost estimate for that part is then left out instead of guessed.
# Entry fields: label, env (API key name), service (dotted pipecat class, built with api_key + Settings),
# default_model / default_voice, models / voices, custom_model / custom_voice (user may type an id),
# live_voices (cartesia | elevenlabs: the API lists voices from the vendor's own account), note.
# last_checked: 2026-11-05 (OpenRouter prices from its live model list; others from public price pages)

stt:
  deepgram:
    label: Deepgram
    env: DEEPGRAM_API_KEY
    service: pipecat.services.deepgram.stt.DeepgramSTTService
    default_model: nova-3-general
    models:
      - { id: nova-3-general, label: Nova 3, price_per_min: 0.0077 }   # sources disagree: 0.0048 to 0.0077
  assemblyai:
    label: AssemblyAI
    env: ASSEMBLYAI_API_KEY
    service: pipecat.services.assemblyai.stt.AssemblyAISTTService
    default_model: universal-3-6-pro
    models:
      - { id: universal-3-6-pro, label: Universal 3.6 Pro, price_per_min: 0.0075 }   # $0.45 per hour streaming; sources agree
  openai:
    label: OpenAI Transcribe
    env: OPENAI_API_KEY
    service: pipecat.services.openai.stt.OpenAISTTService
    default_model: gpt-transcribe
    custom_model: true
    note: Batch style. Waits for you to stop talking, then sends the clip, so it adds delay compared with streaming providers.
    models:
      - { id: gpt-transcribe, label: GPT Transcribe, price_per_min: null }
  groq:
    label: Groq Whisper
    env: GROQ_API_KEY
    service: pipecat.services.groq.stt.GroqSTTService
    default_model: whisper-large-v3-turbo
    note: Batch style. Waits for you to stop talking, then sends the clip.
    models:
      - { id: whisper-large-v3-turbo, label: Whisper Large v3 Turbo, price_per_min: 0.00067 }   # $0.04 per hour
      - { id: whisper-large-v3, label: Whisper Large v3, price_per_min: 0.00185 }               # $0.111 per hour
  elevenlabs:
    label: ElevenLabs Scribe
    env: ELEVENLABS_API_KEY
    service: pipecat.services.elevenlabs.stt.ElevenLabsRealtimeSTTService
    default_model: scribe_v2_realtime
    models:
      - { id: scribe_v2_realtime, label: Scribe v2 Realtime, price_per_min: null }
  cartesia:
    label: Cartesia Ink
    env: CARTESIA_API_KEY
    service: pipecat.services.cartesia.stt.CartesiaSTTService
    default_model: ink-whisper
    models:
      - { id: ink-whisper, label: Ink Whisper, price_per_min: null }
  soniox:
    label: Soniox
    env: SONIOX_API_KEY
    service: pipecat.services.soniox.stt.SonioxSTTService
    default_model: stt-rt-v5
    models:
      - { id: stt-rt-v5, label: Realtime v5, price_per_min: null }
  gladia:
    label: Gladia
    env: GLADIA_API_KEY
    service: pipecat.services.gladia.stt.GladiaSTTService
    default_model: solaria-1
    models:
      - { id: solaria-1, label: Solaria 1, price_per_min: null }
  together:
    label: Together AI Whisper
    env: TOGETHER_API_KEY
    service: pipecat.services.together.stt.TogetherSTTService
    default_model: openai/whisper-large-v3
    models:
      - { id: openai/whisper-large-v3, label: Whisper Large v3, price_per_min: null }

