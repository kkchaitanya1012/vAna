    models:
      - { id: openai/gpt-oss-120b, label: GPT-OSS 120B, in_per_m: 0.15, out_per_m: 0.60, note: Reasoning model. }
      - { id: openai/gpt-oss-20b, label: GPT-OSS 20B, in_per_m: 0.075, out_per_m: 0.30, note: Reasoning model. }
      - { id: qwen/qwen3.8-27b, label: Qwen 3.8 27B, in_per_m: null, out_per_m: null }
  openai:
    label: OpenAI
    env: OPENAI_API_KEY
    default_model: gpt-4o-mini
    models:
      - { id: gpt-4o-mini, label: GPT-4o mini, in_per_m: 0.15, out_per_m: 0.60 }

